name: Release storage CLI

on:
  push:
    tags: ["storage-cli-v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: storage-cli-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.detachedHead
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Require release commit to be contained in refreshed main
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.23.2"

      - name: Require a tag matching the package version
        run: |
          expected_version="${GITHUB_REF_NAME#storage-cli-v}"
          package_version="$(node -e 'console.log(require("./package.json").version)')"
          test "$expected_version" = "$package_version"

      - name: Refuse to replace an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          inspection="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; refusing to replace it" >&2
            exit 1
          elif printf '%s\n' "$inspection" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            echo "confirmed immutable GitHub Release is unused: $GITHUB_REF_NAME"
          else
            echo "cannot prove whether GitHub Release exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci --no-fund

      - name: Verify and build
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Package a self-contained CLI archive
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          packed_archive="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$packed_archive"
          mv "$packed_archive" "release/${GITHUB_REF_NAME}.tgz"
          (cd release && sha256sum "${GITHUB_REF_NAME}.tgz" > SHA256SUMS)

      - name: Verify offline global installation
        run: |
          install_prefix="$RUNNER_TEMP/storage-cli-install"
          npm install --global --prefix "$install_prefix" --offline --ignore-scripts --no-fund "${GITHUB_WORKSPACE}/release/${GITHUB_REF_NAME}.tgz"
          "$install_prefix/bin/telecrypt-io" --help

      - name: Attest release archive
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: release/${{ github.ref_name }}.tgz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "release/${GITHUB_REF_NAME}.tgz" \
            release/SHA256SUMS
