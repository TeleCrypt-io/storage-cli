name: Release storage CLI

on:
  push:
    tags: ["storage-cli-v*"]

permissions:
  contents: write

concurrency:
  group: storage-cli-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check the tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#storage-cli-v}"
          [[ "$tag" == "storage-cli-v$version" ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          npm_version="$(node -p 'require("./package.json").packageManager.replace(/^npm@/u, "")')"
          test "$(npm --version)" = "$npm_version"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const version = process.env.GITHUB_REF_NAME.slice("storage-cli-v".length);
          if (manifest.version !== version || lock.packages?.[""]?.version !== version) {
            throw new Error("tag, package, and lockfile versions must match");
          }
          NODE

      - name: Install, test, and build
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run lint
          npm run test:unit
          npm run build

      - name: Add bundled dependency notices and package the CLI
        run: |
          set -euo pipefail
          mkdir -p release
          node scripts/generateThirdPartyLicenses.mjs package-lock.json node_modules THIRD-PARTY-LICENSES.txt
          npm pack --ignore-scripts --pack-destination release
          archive="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          mv "$archive" "release/$GITHUB_REF_NAME.tgz"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release/$GITHUB_REF_NAME.tgz" --verify-tag --generate-notes
