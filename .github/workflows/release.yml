name: Release storage CLI

on:
  push:
    tags: ["storage-cli-v*"]

permissions:
  contents: read

concurrency:
  group: storage-cli-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_PARAMETERS: ""
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: /bin/false
  SSH_ASKPASS: /bin/false
  GIT_SSH: ""
  GIT_SSH_COMMAND: ""
  GIT_SSH_VARIANT: ""
  GIT_PROXY_COMMAND: ""
  GIT_SSL_NO_VERIFY: ""
  GIT_HTTP_EXTRAHEADER: ""
  GIT_CURL_VERBOSE: ""
  GIT_TRACE: ""
  GIT_TRACE_PACKET: ""
  GIT_TRACE_CURL: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  GH_HOST: github.com
  SDK_REF: v0.6.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm

      - name: Test release policy helpers offline
        run: |
          node --test test/releasePolicy.test.mjs
          bash test/releaseTransport.test.sh

      - name: Verify the immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hardenReleaseTransport.sh . https://github.com/TeleCrypt-io/storage-cli.git
          node scripts/verifyReleaseSource.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"
          test "$(npm --version)" = "11.19.0"
          timeout 120s git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tag="$(timeout 30s git ls-remote --refs origin "$tag_ref")"
          test "$(wc -l <<<"$remote_tag")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_tag")" = "$tag_object"
          remote_commit_ref="${tag_ref}^{}"
          remote_commit="$(timeout 30s git ls-remote origin "$remote_commit_ref")"
          test "$(wc -l <<<"$remote_commit")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_commit")" = "$GITHUB_SHA"
          remote_main_line="$(timeout 30s git ls-remote --heads origin refs/heads/main)"
          test "$(wc -l <<<"$remote_main_line")" = 1
          remote_main="$(awk '{ print $1 }' <<<"$remote_main_line")"
          test "$remote_main" = "$GITHUB_SHA"
          mkdir -p release
          cat > release/source-identity.txt <<EOF
          tag_ref=$tag_ref
          tag_object=$tag_object
          tag_commit=$tag_commit
          remote_main=$remote_main
          EOF

      - name: Require the exact SDK release
        uses: actions/checkout@v7.0.1
        with:
          repository: TeleCrypt-io/storage-sdk
          ref: ${{ env.SDK_REF }}
          path: storage-sdk
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the exact SDK release source
        shell: bash
        run: |
          set -euo pipefail
          : "${SDK_REF:?SDK_REF is required}"
          bash scripts/hardenReleaseTransport.sh storage-sdk https://github.com/TeleCrypt-io/storage-sdk.git
          sdk_ref="refs/tags/$SDK_REF"
          test "$(git -C storage-sdk cat-file -t "$sdk_ref")" = tag
          sdk_tag_object="$(git -C storage-sdk rev-parse "$sdk_ref")"
          sdk_tag_commit="$(git -C storage-sdk rev-parse "$sdk_ref^{commit}")"
          test "$(git -C storage-sdk rev-parse HEAD)" = "$sdk_tag_commit"
          remote_sdk_tag="$(timeout 30s git -C storage-sdk ls-remote --refs origin "$sdk_ref")"
          test "$(wc -l <<<"$remote_sdk_tag")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_sdk_tag")" = "$sdk_tag_object"
          remote_sdk_commit="$(timeout 30s git -C storage-sdk ls-remote origin "$sdk_ref^{}")"
          test "$(wc -l <<<"$remote_sdk_commit")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_sdk_commit")" = "$sdk_tag_commit"
          sdk_version="$(node -p 'require("./storage-sdk/package.json").version')"
          test "$sdk_version" = "${SDK_REF#v}"
          printf 'tag_ref=%s\ntag_object=%s\ntag_commit=%s\nversion=%s\n' \
            "$sdk_ref" "$sdk_tag_object" "$sdk_tag_commit" "$sdk_version" > release/sdk-source-identity.txt

      - name: Verify exact SDK registry bytes against the annotated tag
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="${SDK_REF#v}"
          # Download the exact accepted SDK release selected by the lockfile.
          # The SDK checkout below remains the authority for npm/SLSA
          # provenance; this local check binds the downloaded bytes to our
          # lockfile before that provenance check runs.
          selected_version="$(node -p 'require("./package.json").dependencies["@telecrypt-io/storage"]')"
          if test "$selected_version" != "$sdk_version"; then
            echo "SDK registry-byte verification requires the manifest to select $sdk_version; current selection is $selected_version" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/storage-sdk-package"
          timeout 120s npm pack --ignore-scripts --no-package-lock \
            --pack-destination "$RUNNER_TEMP/storage-sdk-package" \
            "@telecrypt-io/storage@$sdk_version"
          sdk_archive="$(find "$RUNNER_TEMP/storage-sdk-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$sdk_archive"

          provenance_dir="$RUNNER_TEMP/storage-sdk-provenance"
          mkdir -m 700 "$provenance_dir"
          source scripts/capture-diagnostics.sh
          capture_command() {
            local stdout_path="$1" stderr_path="$2"
            shift 2
            local status
            if run_captured "$stdout_path" "$stderr_path" 120 "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$stdout_path" "$stderr_path"
          }
          replay_api_failure() {
            local body="$1" error="$2" status replay_status=0 semantic_output="$1.semantic.out" semantic_error="$1.semantic.err"
            shift 2
            if "$@" >"$semantic_output" 2>"$semantic_error"; then
              if cat "$semantic_error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            replay_capture "$body" "$error" true "$semantic_output" "$semantic_error" || replay_status="$?"
            return "$status"
          }
          retry_registry() {
            local stdout_path="$1" stderr_path="$2" status attempt attempt_stdout attempt_stderr replay_failed=0
            shift 2
            mkdir -p "$stdout_path.attempts"
            for attempt in $(seq 1 12); do
              attempt_stdout="$stdout_path.attempts/$attempt.out"
              attempt_stderr="$stdout_path.attempts/$attempt.err"
              if run_captured "$attempt_stdout" "$attempt_stderr" 120 "$@"; then
                status=0
              else
                status="$?"
              fi
              cp "$attempt_stdout" "$stdout_path"
              cp "$attempt_stderr" "$stderr_path"
              if test "$status" = 0; then
                if replay_capture "$attempt_stdout" "$attempt_stderr" false; then :; else
                  replay_failed=1
                fi
                if test "$replay_failed" -ne 0; then return 1; fi
                return 0
              fi
              if replay_capture "$attempt_stdout" "$attempt_stderr"; then :; else
                replay_failed=1
              fi
              if test "$attempt" = 12; then return "$status"; fi
              sleep 10
            done
          }
          dist="$provenance_dir/dist.json"
          dist_err="$provenance_dir/dist.err"
          retry_registry "$dist" "$dist_err" npm view \
            "@telecrypt-io/storage@$sdk_version" dist --json
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$dist" "$dist_err"; then
            replay_capture "$dist" "$dist_err"
            exit 1
          fi
          attestations_url="$(replay_api_failure "$dist" "$dist_err" node - "$dist" "$sdk_version" <<'NODE'
          const fs = require("node:fs");
          const dist = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const version = process.argv[3];
          const expected = `https://registry.npmjs.org/-/npm/v1/attestations/@telecrypt-io%2fstorage@${version}`;
          let parsed;
          try { parsed = new URL(dist?.attestations?.url); } catch { process.exit(1); }
          if (dist.attestations.url !== expected || parsed.protocol !== "https:" || parsed.hostname !== "registry.npmjs.org" || parsed.username || parsed.password || parsed.port || parsed.search || parsed.hash) process.exit(1);
          process.stdout.write(dist.attestations.url);
          NODE
          )"
          attestations="$provenance_dir/attestations.json"
          attestations_err="$provenance_dir/attestations.err"
          retry_registry "$attestations" "$attestations_err" curl --proto '=https' --tlsv1.2 \
            --show-error --fail-with-body --max-time 120 --connect-timeout 20 "$attestations_url"
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$attestations" "$attestations_err"; then
            replay_capture "$attestations" "$attestations_err"
            exit 1
          fi

          # Cryptographic npm/Sigstore verification must precede the
          # first-party structural binding of the verified attestation data.
          audit="$provenance_dir/audit"
          mkdir -m 700 "$audit"
          printf '%s\n' '{"name":"storage-cli-sdk-signature-check","private":true,"dependencies":{"@telecrypt-io/storage":"'"$sdk_version"'"}}' > "$audit/package.json"
          audit_install_out="$provenance_dir/audit-install.out"
          audit_install_err="$provenance_dir/audit-install.err"
          # shellcheck disable=SC2016
          capture_command "$audit_install_out" "$audit_install_err" bash -c 'cd "$1" && npm install --ignore-scripts --no-fund --no-audit' bash "$audit"
          if grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$audit_install_out" "$audit_install_err"; then
            replay_capture "$audit_install_out" "$audit_install_err"
            exit 1
          fi
          audit_out="$provenance_dir/audit.out"
          audit_err="$provenance_dir/audit.err"
          # shellcheck disable=SC2016
          capture_command "$audit_out" "$audit_err" bash -c 'cd "$1" && npm audit signatures' bash "$audit"
          if ! test -s "$audit_out"; then
            replay_capture "$audit_out" "$audit_err"
            exit 1
          fi
          if ! grep -Eqi 'verified attestations?' "$audit_out"; then
            replay_capture "$audit_out" "$audit_err"
            exit 1
          fi

          # Bind the audited registry bytes to this consumer's exact lock entry.
          # The SDK checkout remains the sole authority for npm/SLSA provenance.
          node scripts/verifySdkPackage.mjs "$sdk_archive" package-lock.json "$sdk_version"

          sdk_tag_commit="$(awk -F= '$1 == "tag_commit" { print $2 }' release/sdk-source-identity.txt)"
          provenance_out="$provenance_dir/provenance.out"
          provenance_err="$provenance_dir/provenance.err"
          capture_command "$provenance_out" "$provenance_err" node storage-sdk/scripts/verify-npm-provenance.mjs \
            --dist "$dist" --attestations "$attestations" --archive "$sdk_archive" \
            --package '@telecrypt-io/storage' --version "$sdk_version" --tag "$SDK_REF" --commit "$sdk_tag_commit"
          if ! test -s "$provenance_out"; then
            replay_capture "$provenance_out" "$provenance_err"
            exit 1
          fi
          if ! grep -Fq 'verified npm provenance' "$provenance_out"; then
            replay_capture "$provenance_out" "$provenance_err"
            exit 1
          fi

      - name: Require exact package and lockfile versions
        run: |
          node scripts/verify-consumer-dependencies.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const expected = {
            "@telecrypt-io/storage": "0.6.1",
            "matrix-js-sdk": "42.2.0",
          };
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const root = lock.packages?.[""];
          if (packageJson.version !== process.env.GITHUB_REF_NAME.slice("storage-cli-v".length)) {
            throw new Error("package.json version does not match the release tag");
          }
          if (root?.name !== packageJson.name || root?.version !== packageJson.version) {
            throw new Error("package-lock.json root does not match package.json");
          }
          for (const [name, version] of Object.entries(expected)) {
            const entry = lock.packages?.[`node_modules/${name}`];
            const tarball = name.startsWith("@") ? name.slice(name.indexOf("/") + 1) : name;
            const resolved = `https://registry.npmjs.org/${name}/-/${tarball}-${version}.tgz`;
            if (
              packageJson.dependencies?.[name] !== version ||
              root.dependencies?.[name] !== version ||
              entry?.version !== version ||
              entry.resolved !== resolved ||
              !/^sha512-[A-Za-z0-9+/]{86}==$/.test(entry.integrity ?? "")
            ) throw new Error(`${name} is not the exact locked ${version} registry artifact`);
          }
          NODE

      - name: Install and test exact dependencies
        run: |
          set -euo pipefail
          timeout 300s npm ci --ignore-scripts --no-fund --no-audit
          timeout 180s npm run lint
          timeout 300s npm run test:unit
          timeout 180s npm run build

      - name: Package and validate the tested archive
        run: |
          set -euo pipefail
          mkdir -p release
          source scripts/capture-diagnostics.sh
          : > THIRD-PARTY-LICENSES.txt
          trap 'rm -f -- THIRD-PARTY-LICENSES.txt' EXIT
          if run_captured release/pack.json release/pack.err 120 npm pack --ignore-scripts --dry-run --json; then status=0; else status="$?"; fi
          finish_capture "$status" true release/pack.json release/pack.err
          test "$status" = 0
          require_capture release/pack.json release/pack.err node --input-type=module <<'NODE'
          import fs from "node:fs";
          const metadata = JSON.parse(fs.readFileSync("release/pack.json", "utf8"));
          if (!Array.isArray(metadata) || metadata.length !== 1 || !Array.isArray(metadata[0]?.files)) {
            throw new Error("npm pack did not return one file manifest");
          }
          const paths = metadata[0].files.map((entry) => {
            if (!entry || typeof entry.path !== "string" || entry.path === "" || entry.path.startsWith("/") || entry.path.includes("\\")) {
              throw new Error("npm pack returned an invalid archive path");
            }
            return `package/${entry.path}`;
          });
          fs.writeFileSync("release/archive-contents.txt", `${paths.join("\n")}\n`, { encoding: "utf8", mode: 0o600 });
          NODE
          node scripts/validateReleaseArchive.mjs release/archive-contents.txt package-lock.json release/THIRD-PARTY-LICENSES.txt
          test -s release/THIRD-PARTY-LICENSES.txt
          cp -- release/THIRD-PARTY-LICENSES.txt THIRD-PARTY-LICENSES.txt
          timeout 120s npm pack --ignore-scripts --pack-destination release
          packed_archive="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$packed_archive"
          mv -- "$packed_archive" "release/${GITHUB_REF_NAME}.tgz"
          test "$(stat -c%s "release/${GITHUB_REF_NAME}.tgz")" -le 268435456
          if run_captured release/archive-contents-final.txt release/archive-contents-final.err 30 tar -tzf "release/${GITHUB_REF_NAME}.tgz"; then status=0; else status="$?"; fi
          finish_capture "$status" true release/archive-contents-final.txt release/archive-contents-final.err
          test "$status" = 0
          node scripts/validateReleaseArchive.mjs release/archive-contents-final.txt package-lock.json release/THIRD-PARTY-LICENSES-final.txt "release/${GITHUB_REF_NAME}.tgz"
          cmp -- release/THIRD-PARTY-LICENSES.txt release/THIRD-PARTY-LICENSES-final.txt
          if run_captured release/THIRD-PARTY-LICENSES-archive.txt release/THIRD-PARTY-LICENSES-archive.err 30 tar -xOzf "release/${GITHUB_REF_NAME}.tgz" package/THIRD-PARTY-LICENSES.txt; then status=0; else status="$?"; fi
          finish_capture "$status" true release/THIRD-PARTY-LICENSES-archive.txt release/THIRD-PARTY-LICENSES-archive.err
          test "$status" = 0
          cmp -- release/THIRD-PARTY-LICENSES.txt release/THIRD-PARTY-LICENSES-archive.txt
          archive_sha256="$(sha256sum "release/${GITHUB_REF_NAME}.tgz" | awk '{ print $1 }')"
          printf 'archive_sha256=%s\n' "$archive_sha256" >> release/source-identity.txt

      - name: Verify tested archive binding
        run: |
          set -euo pipefail
          archive_sha256="$(awk -F= '$1 == "archive_sha256" { print $2 }' release/source-identity.txt)"
          test "$(sha256sum "release/${GITHUB_REF_NAME}.tgz" | awk '{ print $1 }')" = "$archive_sha256"
          test "$(stat -c%s "release/${GITHUB_REF_NAME}.tgz")" -le 268435456

      - name: Upload the tested archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: storage-cli-${{ github.ref_name }}-${{ github.run_id }}-${{ github.sha }}
          overwrite: true
          path: |
            release/${{ github.ref_name }}.tgz
            release/source-identity.txt
            release/sdk-source-identity.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_CONFIG_DIR: ${{ github.workspace }}/.storage-cli-gh-config
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"

      - name: Recheck the immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hardenReleaseTransport.sh . https://github.com/TeleCrypt-io/storage-cli.git
          node scripts/verifyReleaseSource.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"
          test "$(npm --version)" = "11.19.0"
          timeout 120s git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "$tag_ref^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main_line="$(timeout 30s git ls-remote --heads origin refs/heads/main)"
          test "$(wc -l <<<"$remote_main_line")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_main_line")" = "$GITHUB_SHA"

      - name: Download and verify the tested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "storage-cli-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}-${GITHUB_SHA}" \
            --dir release

      - name: Publish one exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$GH_CONFIG_DIR"
          source scripts/capture-diagnostics.sh
          capture_gh() {
            local output="$1" error="$2" status
            shift 2
            if run_captured "$output" "$error" 30 gh "$@"; then
              status=0
            else
              status="$?"
            fi
            finish_capture "$status" true "$output" "$error"
          }
          replay_api_failure() {
            local body="$1" error="$2" status replay_status=0 semantic_output="$1.semantic.out" semantic_error="$1.semantic.err"
            shift 2
            if "$@" >"$semantic_output" 2>"$semantic_error"; then
              if cat "$semantic_error" >&2; then :; else replay_status=1; fi
              if cat "$semantic_output"; then :; else replay_status=1; fi
              return "$replay_status"
            else
              status="$?"
            fi
            replay_capture "$body" "$error" true "$semantic_output" "$semantic_error" || replay_status="$?"
            return "$status"
          }
          verify_mutation_boundary() {
            local boundary_tag_ref="refs/tags/$GITHUB_REF_NAME"
            timeout 120s git fetch --force --no-tags origin \
              "$boundary_tag_ref:$boundary_tag_ref"
            test "$(git cat-file -t "$boundary_tag_ref")" = tag
            local boundary_tag_object
            boundary_tag_object="$(git rev-parse "$boundary_tag_ref")"
            test "$boundary_tag_object" = "$tag_object"
            local boundary_tag_commit
            boundary_tag_commit="$(git rev-parse "$boundary_tag_ref^{commit}")"
            test "$boundary_tag_commit" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            local boundary_archive_sha256
            boundary_archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
            test "$boundary_archive_sha256" = "$archive_sha256"
            local boundary_remote_tag
            boundary_remote_tag="$(timeout 30s git ls-remote --refs origin "$boundary_tag_ref")"
            test "$(wc -l <<<"$boundary_remote_tag")" = 1
            test "$(awk '{ print $1 }' <<<"$boundary_remote_tag")" = "$boundary_tag_object"
            local boundary_remote_commit
            boundary_remote_commit="$(timeout 30s git ls-remote origin "$boundary_tag_ref^{}")"
            test "$(wc -l <<<"$boundary_remote_commit")" = 1
            test "$(awk '{ print $1 }' <<<"$boundary_remote_commit")" = "$boundary_tag_commit"
            local boundary_remote_main_line
            boundary_remote_main_line="$(timeout 30s git ls-remote --heads origin refs/heads/main)"
            test "$(wc -l <<<"$boundary_remote_main_line")" = 1
            test "$(awk '{ print $1 }' <<<"$boundary_remote_main_line")" = "$boundary_tag_commit"
            local boundary_remote_sdk_tag
            boundary_remote_sdk_tag="$(timeout 30s git ls-remote --refs https://github.com/TeleCrypt-io/storage-sdk.git "$sdk_ref")"
            test "$(wc -l <<<"$boundary_remote_sdk_tag")" = 1
            test "$(awk '{ print $1 }' <<<"$boundary_remote_sdk_tag")" = "$sdk_tag_object"
            local boundary_remote_sdk_commit
            boundary_remote_sdk_commit="$(timeout 30s git ls-remote https://github.com/TeleCrypt-io/storage-sdk.git "$sdk_ref^{}")"
            test "$(wc -l <<<"$boundary_remote_sdk_commit")" = 1
            test "$(awk '{ print $1 }' <<<"$boundary_remote_sdk_commit")" = "$sdk_tag_commit"
          }
          archive="release/${GITHUB_REF_NAME}.tgz"
          test "$(find release -maxdepth 1 -type f -name '*.tgz' | wc -l)" = 1
          test "$(find release -maxdepth 1 -type f | wc -l)" = 3
          test -s "$archive"
          test "$(stat -c%s "$archive")" -le 268435456
          test -s release/source-identity.txt
          test "$(wc -c < release/source-identity.txt)" -le 65536
          test -s release/sdk-source-identity.txt

          # Re-fetch and compare the immutable tag object, peeled commit, tag
          # ref, and the exact current main tip immediately before any Release
          # API mutation. The build job's identity files must agree exactly.
          node scripts/verifyReleaseSource.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"
          timeout 120s git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tag="$(timeout 30s git ls-remote --refs origin "$tag_ref")"
          test "$(wc -l <<<"$remote_tag")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_tag")" = "$tag_object"
          remote_commit="$(timeout 30s git ls-remote origin "${tag_ref}^{}")"
          test "$(wc -l <<<"$remote_commit")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_commit")" = "$tag_commit"
          remote_main_line="$(timeout 30s git ls-remote --heads origin refs/heads/main)"
          test "$(wc -l <<<"$remote_main_line")" = 1
          remote_main="$(awk '{ print $1 }' <<<"$remote_main_line")"
          test "$remote_main" = "$tag_commit"
          archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
          node --input-type=module - release/source-identity.txt "$tag_ref" "$tag_object" "$tag_commit" "$remote_main" "$archive_sha256" <<'NODE'
          import fs from "node:fs";
          import { validateSourceIdentity } from "./scripts/releasePolicy.mjs";
          const [identityPath, tagRef, tagObject, tagCommit, remoteMain, archiveSha256] = process.argv.slice(2);
          validateSourceIdentity(fs.readFileSync(identityPath, "utf8"), {
            tag_ref: tagRef,
            tag_object: tagObject,
            tag_commit: tagCommit,
            remote_main: remoteMain,
            archive_sha256: archiveSha256,
          });
          NODE

          test "$(wc -c < release/sdk-source-identity.txt)" -le 65536
          node --input-type=module - release/sdk-source-identity.txt <<'NODE'
          import fs from "node:fs";
          import { validateSdkIdentity } from "./scripts/releasePolicy.mjs";
          const sdkRef = process.env.SDK_REF;
          if (!sdkRef || !/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/u.test(sdkRef)) {
            throw new Error("SDK_REF is not an exact release tag");
          }
          validateSdkIdentity(fs.readFileSync(process.argv[2], "utf8"), {
            tagRef: `refs/tags/${sdkRef}`,
            version: sdkRef.slice(1),
          });
          NODE
          : "${SDK_REF:?SDK_REF is required}"
          sdk_ref="refs/tags/$SDK_REF"
          sdk_tag_object="$(awk -F= '$1 == "tag_object" { print $2 }' release/sdk-source-identity.txt)"
          sdk_tag_commit="$(awk -F= '$1 == "tag_commit" { print $2 }' release/sdk-source-identity.txt)"
          remote_sdk_tag="$(timeout 30s git ls-remote --refs https://github.com/TeleCrypt-io/storage-sdk.git "$sdk_ref")"
          test "$(wc -l <<<"$remote_sdk_tag")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_sdk_tag")" = "$sdk_tag_object"
          remote_sdk_commit="$(timeout 30s git ls-remote https://github.com/TeleCrypt-io/storage-sdk.git "$sdk_ref^{}")"
          test "$(wc -l <<<"$remote_sdk_commit")" = 1
          test "$(awk '{ print $1 }' <<<"$remote_sdk_commit")" = "$sdk_tag_commit"

          source scripts/capture-diagnostics.sh
          if run_captured "$RUNNER_TEMP/storage-cli-release-contents.txt" "$RUNNER_TEMP/storage-cli-release-contents.err" 30 tar -tzf "$archive"; then status=0; else status="$?"; fi
          finish_capture "$status" true "$RUNNER_TEMP/storage-cli-release-contents.txt" "$RUNNER_TEMP/storage-cli-release-contents.err"
          test "$status" = 0
          timeout 120s node scripts/validateReleaseArchive.mjs \
            "$RUNNER_TEMP/storage-cli-release-contents.txt" package-lock.json \
            "$RUNNER_TEMP/storage-cli-release-inventory.txt" "$archive"
          if run_captured "$RUNNER_TEMP/storage-cli-release-inventory-archive.txt" "$RUNNER_TEMP/storage-cli-release-inventory-archive.err" 30 tar -xOzf "$archive" package/THIRD-PARTY-LICENSES.txt; then status=0; else status="$?"; fi
          finish_capture "$status" true "$RUNNER_TEMP/storage-cli-release-inventory-archive.txt" "$RUNNER_TEMP/storage-cli-release-inventory-archive.err"
          test "$status" = 0
          cmp -- "$RUNNER_TEMP/storage-cli-release-inventory.txt" "$RUNNER_TEMP/storage-cli-release-inventory-archive.txt"
          if run_captured "$RUNNER_TEMP/storage-cli-release-package.json" "$RUNNER_TEMP/storage-cli-release-package.err" 30 tar -xOzf "$archive" package/package.json; then status=0; else status="$?"; fi
          finish_capture "$status" true "$RUNNER_TEMP/storage-cli-release-package.json" "$RUNNER_TEMP/storage-cli-release-package.err"
          test "$status" = 0
          require_capture "$RUNNER_TEMP/storage-cli-release-package.json" "$RUNNER_TEMP/storage-cli-release-package.err" node --input-type=module - "$RUNNER_TEMP/storage-cli-release-package.json" <<'NODE'
          import fs from "node:fs";
          const packageJson = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = process.env.GITHUB_REF_NAME.slice("storage-cli-v".length);
          if (packageJson.version !== expected) throw new Error("archive package version is not bound to its release tag");
          NODE

          release_endpoint="repos/$GITHUB_REPOSITORY/releases"
          release_json="$RUNNER_TEMP/storage-cli-release.json"
          release_list_json="$RUNNER_TEMP/storage-cli-release-list.json"
          release_list_lines="$RUNNER_TEMP/storage-cli-release-list.jsonl"
          release_list_error="$RUNNER_TEMP/storage-cli-release-list-error.txt"
          release_create_json="$RUNNER_TEMP/storage-cli-release-create.json"
          release_create_error="$RUNNER_TEMP/storage-cli-release-create-error.txt"
          release_get_error="$RUNNER_TEMP/storage-cli-release-get-error.txt"
          fetch_release_state() {
            capture_gh "$release_list_json" "$release_list_error" \
              api --paginate --hostname github.com \
              --header "X-GitHub-Api-Version: 2026-03-10" "${release_endpoint}?per_page=100"
            replay_api_failure "$release_list_json" "$release_list_error" jq -c -s 'map(.[])[]' "$release_list_json" >"$release_list_lines"
            replay_api_failure "$release_list_json" "$release_list_error" node --input-type=module - "$release_list_lines" "$release_json" "$archive" <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";
          import { classifyExistingDraft, findReleaseByTag, parseReleaseList } from "./scripts/releasePolicy.mjs";
          const [listPath, releasePath, archivePath] = process.argv.slice(2);
          const releases = parseReleaseList(fs.readFileSync(listPath, "utf8"));
          const release = findReleaseByTag(releases, process.env.GITHUB_REF_NAME);
          fs.rmSync(releasePath, { force: true });
          if (release === null) {
            process.stdout.write("missing");
          } else {
            const expectedTag = process.env.GITHUB_REF_NAME;
            const digest = `sha256:${createHash("sha256").update(fs.readFileSync(archivePath)).digest("hex")}`;
            fs.writeFileSync(releasePath, JSON.stringify(release), { encoding: "utf8", mode: 0o600 });
            process.stdout.write(classifyExistingDraft(release, {
              tag: expectedTag,
              archiveName: `${expectedTag}.tgz`,
              size: fs.statSync(archivePath).size,
              digest,
            }));
          }
          NODE
          }
          set_release_resource_endpoint_from_json() {
            local release_path="$1"
            release_id="$(replay_api_failure "$release_path" "$release_get_error" node --input-type=module - "$release_path" <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!release || typeof release !== "object" || Array.isArray(release) ||
              !Number.isSafeInteger(release.id) || release.id < 1) {
            throw new Error("GitHub Release ID is invalid");
          }
          process.stdout.write(String(release.id));
          NODE
            )"
            release_resource_endpoint="${release_endpoint}/${release_id}"
          }
          set_release_resource_endpoint() {
            set_release_resource_endpoint_from_json "$release_json"
          }
          fetch_release_by_id() {
            capture_gh "$release_json" "$release_get_error" \
              api --hostname github.com --header "X-GitHub-Api-Version: 2026-03-10" "$release_resource_endpoint"
            replay_api_failure "$release_json" "$release_get_error" node --input-type=module - "$release_json" "$archive" "$release_id" <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";
          import { classifyExistingDraft } from "./scripts/releasePolicy.mjs";
          const [releasePath, archivePath, expectedId] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          if (!Number.isSafeInteger(release?.id) || release.id < 1 || String(release.id) !== expectedId) {
            throw new Error("GitHub Release ID is not exact");
          }
          const expectedTag = process.env.GITHUB_REF_NAME;
          const digest = `sha256:${createHash("sha256").update(fs.readFileSync(archivePath)).digest("hex")}`;
          process.stdout.write(classifyExistingDraft(release, {
            tag: expectedTag,
            archiveName: `${expectedTag}.tgz`,
            size: fs.statSync(archivePath).size,
            digest,
          }));
          NODE
          }
          release_state="missing"
          if ! release_state="$(fetch_release_state)"; then
            echo "cannot prove whether the GitHub Release exists" >&2
            exit 1
          fi
          if [ "$release_state" != "missing" ]; then
            set_release_resource_endpoint
          fi

          # Do not create or attach an asset until the live remote identity is
          # revalidated after the read-only Release probe.
          verify_mutation_boundary
          if [ "$release_state" = "missing" ]; then
            capture_gh "$release_create_json" "$release_create_error" \
              api --hostname github.com --method POST \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --raw-field "tag_name=$GITHUB_REF_NAME" \
              --raw-field "name=$GITHUB_REF_NAME" \
              --raw-field "target_commitish=$tag_commit" \
              --field draft=true \
              --field prerelease=false \
              --field generate_release_notes=true \
              "$release_endpoint"
            set_release_resource_endpoint_from_json "$release_create_json"
            if ! release_state="$(fetch_release_by_id)"; then
              echo "cannot prove whether the newly created GitHub Release matches the create response" >&2
              exit 1
            fi
            if [ "$release_state" != "draft-empty" ] && [ "$release_state" != "draft-exact" ]; then
              echo "unexpected Release state after creation: $release_state" >&2
              exit 1
            fi
          fi
          if [ "$release_state" = "draft-empty" ]; then
            verify_mutation_boundary
            archive_name="${archive##*/}"
            capture_gh "$RUNNER_TEMP/storage-cli-release-upload.out" "$RUNNER_TEMP/storage-cli-release-upload.err" \
              api --method POST \
              --header "Content-Type: application/gzip" \
              --input "$archive" "https://uploads.github.com/${release_resource_endpoint}/assets?name=${archive_name}"
          elif [ "$release_state" != "draft-exact" ]; then
            echo "unexpected Release state: $release_state" >&2
            exit 1
          fi

          if ! release_state="$(fetch_release_by_id)"; then
            echo "cannot prove whether the GitHub Release exists after upload" >&2
            exit 1
          fi
          test "$release_state" = "draft-exact"
          digest="sha256:$(sha256sum "$archive" | awk '{print $1}')"
          replay_api_failure "$release_json" "$release_get_error" node --input-type=module - "$release_json" "$archive" "$digest" <<'NODE'
          import fs from "node:fs";
          import { validateDraft } from "./scripts/releasePolicy.mjs";
          const [releasePath, archivePath, digest] = process.argv.slice(2);
          validateDraft(JSON.parse(fs.readFileSync(releasePath, "utf8")), {
            tag: process.env.GITHUB_REF_NAME,
            archiveName: `${process.env.GITHUB_REF_NAME}.tgz`,
            size: fs.statSync(archivePath).size,
            digest,
          });
          NODE

          verify_publish_boundary() {
            # Revalidate the authoritative Git identities first, then fetch and
            # validate the mutable draft as the final read-only operation before
            # publication. No other network operation occurs before the PATCH.
            verify_mutation_boundary
            capture_gh "$RUNNER_TEMP/storage-cli-release-before-publish.json" "$RUNNER_TEMP/storage-cli-release-before-publish.err" \
              api --hostname github.com --header "X-GitHub-Api-Version: 2026-03-10" "$release_resource_endpoint"
            replay_api_failure "$RUNNER_TEMP/storage-cli-release-before-publish.json" "$RUNNER_TEMP/storage-cli-release-before-publish.err" node --input-type=module - "$RUNNER_TEMP/storage-cli-release-before-publish.json" "$archive" "$digest" <<'NODE'
          import fs from "node:fs";
          import { validateDraft } from "./scripts/releasePolicy.mjs";
          const [releasePath, archivePath, digest] = process.argv.slice(2);
          validateDraft(JSON.parse(fs.readFileSync(releasePath, "utf8")), {
            tag: process.env.GITHUB_REF_NAME,
            archiveName: `${process.env.GITHUB_REF_NAME}.tgz`,
            size: fs.statSync(archivePath).size,
            digest,
          });
          NODE
          }

          # The final boundary keeps the authoritative Git checks adjacent to
          # the final draft/asset validation and irreversible publication.
          verify_publish_boundary

          capture_gh "$RUNNER_TEMP/storage-cli-published-release.json" "$RUNNER_TEMP/storage-cli-publish.err" \
            api --hostname github.com --method PATCH \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            -F draft=false "$release_resource_endpoint"
          capture_gh "$RUNNER_TEMP/storage-cli-final-release.json" "$RUNNER_TEMP/storage-cli-final-release.err" \
            api --hostname github.com --header "X-GitHub-Api-Version: 2026-03-10" "$release_resource_endpoint"
          replay_api_failure "$RUNNER_TEMP/storage-cli-final-release.json" "$RUNNER_TEMP/storage-cli-final-release.err" node --input-type=module - "$RUNNER_TEMP/storage-cli-final-release.json" "$archive" "$digest" <<'NODE'
          import fs from "node:fs";
          import { validatePublished } from "./scripts/releasePolicy.mjs";
          const [releasePath, archivePath, digest] = process.argv.slice(2);
          validatePublished(JSON.parse(fs.readFileSync(releasePath, "utf8")), {
            tag: process.env.GITHUB_REF_NAME,
            archiveName: `${process.env.GITHUB_REF_NAME}.tgz`,
            size: fs.statSync(archivePath).size,
            digest,
          });
          NODE
